type IndexedContract @entity(immutable: true) {
  id: Bytes!
  contractAddress: Bytes!
  registrant: Bytes!
  kind: Bytes!
  registeredAt: BigInt!
  registeredTx: Bytes!
  blockNumber: BigInt!
}

type ValueChanged @entity(immutable: true) {
  id: Bytes!
  contract: Bytes!
  setter: Bytes!
  newValue: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type HookAfterSwap @entity(immutable: true) {
  id: Bytes!
  contract: Bytes!
  caller: Bytes!
  newCount: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type VerdictReceived @entity(immutable: true) {
  id: Bytes!
  contract: Bytes!
  verdictCode: Int!
  riskMask: Int!
  sourceHash: Bytes!
  reporter: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}
