name: CI

on:
  push:
    branches: [main, master, ethonline-2026]
  pull_request:
    branches: [main, master, ethonline-2026]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Public placeholders so Vite can resolve imports; real secrets unused at build time
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-key-placeholder

      - name: Hardhat compile
        run: npx hardhat compile
        continue-on-error: true
