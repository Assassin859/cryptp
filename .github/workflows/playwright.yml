name: Playwright Smoke Tests

on:
  push:
    branches: [main, master, ethonline-2026]
  pull_request:
    branches: [main, master, ethonline-2026]

jobs:
  smoke:
    name: E2E smoke (Chromium)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run smoke
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            docs/SMOKE_TEST_REPORT.md
            tests/e2e/smoke-results.json
          retention-days: 14
          # Do not upload test-results/ — Playwright traces often contain
          # cleartext passwords, JWTs, and account metadata.
